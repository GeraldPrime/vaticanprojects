name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "Starting deployment..."
          
          # Navigate to project directory
          cd /opt/vaticanprojects/vaticanprojects/vaticanprojects || { echo "Failed to change directory"; exit 1; }
          
          # Pull latest changes
          echo "Fetching latest code..."
          git fetch origin || { echo "Git fetch failed"; exit 1; }
          
          echo "Resetting to origin/main..."
          git reset --hard origin/main || { echo "Git reset failed"; exit 1; }
          
          echo "Cleaning untracked files..."
          git clean -fd || echo "Warning: git clean had issues, continuing..."
          
          # Activate virtual environment and install dependencies
          echo "Installing dependencies..."
          source /opt/vaticanprojects/bin/activate
          pip install -r requirements.txt || echo "Warning: pip install had issues, continuing..."
          
          # Run Django management commands
          echo "Running migrations..."
          python manage.py migrate --noinput || { echo "Migration failed"; exit 1; }
          
          echo "Collecting static files..."
          python manage.py collectstatic --noinput || echo "Warning: Static files collection had issues, continuing..."
          
          # Restart services
          echo "Restarting vaticanprojects service..."
          sudo systemctl restart vaticanprojects || { echo "Failed to restart service"; exit 1; }
          
          echo "Restarting nginx..."
          sudo systemctl restart nginx || echo "Warning: Failed to restart nginx"
          
          # Check service status
          echo "Checking service status..."
          sudo systemctl is-active vaticanprojects || echo "Warning: service may not be running properly"
          
          echo "✅ Deployment completed successfully!"